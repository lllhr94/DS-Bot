# The native iOS app (app-ios/App): SwiftUI on top of the Swift link in app-ios/DSLink.
# Produces an unsigned IPA; signing happens on the phone.

name: iOS app

on:
  push:
    branches: [main]
    paths:
      - app-ios/**
      - .github/workflows/ios-app.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Native app (iOS, unsigned)
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: app-ios/App
    steps:
      - uses: actions/checkout@v4

      - name: Generate the Xcode project
        run: |
          which xcodegen || brew install xcodegen
          xcodegen generate

      - name: Build (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project DSBotApp.xcodeproj \
            -scheme DSBotApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log | grep -E "error|BUILD|\.swift:[0-9]+:[0-9]+: (error|warning)" | tail -n 120

      - name: Package the IPA
        run: |
          APP="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)"
          test -n "$APP" || { echo "::error::没有找到 .app"; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSCameraUsageDescription' "$APP/Info.plist"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry BotTeam-unsigned.ipa Payload
          ls -lh BotTeam-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: BotTeam-unsigned-ipa
          path: app-ios/App/BotTeam-unsigned.ipa
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-log
          path: app-ios/App/xcodebuild.log
          if-no-files-found: ignore
