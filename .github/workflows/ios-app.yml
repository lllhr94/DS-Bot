# The native iOS app (app-ios/App): SwiftUI on top of the Swift link in app-ios/DSLink.
# Produces an unsigned IPA; signing happens on the phone.

name: iOS app

on:
  push:
    branches: [main]
    paths:
      - app-ios/**
      - .github/workflows/ios-app.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Native app (iOS, unsigned)
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: app-ios/App
    steps:
      - uses: actions/checkout@v4

      - name: Test the engine (AgentKit)
        working-directory: app-ios/AgentKit
        run: |
          set -o pipefail
          swift test 2>&1 | tail -n 80

      - name: Generate the Xcode project
        run: |
          which xcodegen || brew install xcodegen
          xcodegen generate

      - name: Build (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project DSBotApp.xcodeproj \
            -scheme DSBotApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log | grep -E "error|BUILD|\.swift:[0-9]+:[0-9]+: (error|warning)" | tail -n 120

      - name: Package the IPA
        run: |
          APP="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)"
          test -n "$APP" || { echo "::error::没有找到 .app"; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSCameraUsageDescription' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSSpeechRecognitionUsageDescription' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSCalendarsFullAccessUsageDescription' "$APP/Info.plist"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry BotTeam-unsigned.ipa Payload
          ls -lh BotTeam-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: BotTeam-unsigned-ipa
          path: app-ios/App/BotTeam-unsigned.ipa
          if-no-files-found: error

      # A plain download link on the Releases page, so the IPA can be fetched from a phone.
      - name: Publish the IPA to the app-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          gh release view app-latest --repo "$REPO" >/dev/null 2>&1 || \
            gh release create app-latest --repo "$REPO" --prerelease \
              --title "Bot 团队 (未签名 IPA，最新构建)" \
              --notes "每次构建自动更新。下载 BotTeam-unsigned.ipa，用签名工具签名后安装。"
          gh release upload app-latest BotTeam-unsigned.ipa --repo "$REPO" --clobber
          gh release edit app-latest --repo "$REPO" --notes "最新构建：${{ github.sha }}。下载 BotTeam-unsigned.ipa，用签名工具签名后安装。"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-log
          path: app-ios/App/xcodebuild.log
          if-no-files-found: ignore
