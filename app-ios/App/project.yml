name: DSBotApp
options:
  bundleIdPrefix: io.github.lllhr94
  deploymentTarget:
    iOS: "26.0"
packages:
  AgentKit:
    path: ../AgentKit
targets:
  DSBotApp:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: AgentKit
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Bot 团队
        CFBundleShortVersionString: "0.11"
        CFBundleVersion: "12"
        UILaunchScreen: {}
        CADisableMinimumFrameDurationOnPhone: true
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: 拍照发给 Bot 看。
        NSMicrophoneUsageDescription: 按下说话时，用麦克风听你说的话。
        NSSpeechRecognitionUsageDescription: 把你说的话转成文字，发给 Bot。
        NSCalendarsFullAccessUsageDescription: Bot 帮你查日程、加日程（加之前会问你）。
        NSRemindersFullAccessUsageDescription: Bot 帮你查提醒事项、加提醒（加之前会问你）。
        NSPhotoLibraryAddUsageDescription: 保存 Bot 发给你的图片。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.lllhr94.dsbot
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
