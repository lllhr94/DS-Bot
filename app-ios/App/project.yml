name: DSBotApp
options:
  bundleIdPrefix: io.github.lllhr94
  deploymentTarget:
    iOS: "26.0"
packages:
  DSLink:
    path: ../DSLink
targets:
  DSBotApp:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: DSLink
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Bot 团队
        CFBundleShortVersionString: "0.10"
        CFBundleVersion: "11"
        UILaunchScreen: {}
        CADisableMinimumFrameDurationOnPhone: true
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: 用相机扫描电脑上的配对二维码，或者拍照发给 Bot。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.lllhr94.dsbot
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
